sources:
  - name: project-a
    path: 'C:\workspace\project-a'
  - name: project-b
    path: 'D:\workspace\project-b'
extensions:
  - sql
  - java
  - js
  - jsp
exclude_keywords:
  - test
  - backup
  - temp
  - old
exclude_folders:
  - .git
  - target
  - node_modules
  - dist
search:
  ignore_case: true
  include_hidden: false
  respect_gitignore: true
output:
  folder: 'D:\rg-output'
  preserve_structure: true
  overwrite: false
  generate_md: true
  md_filename: 'search_result.md'
