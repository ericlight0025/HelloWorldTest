sources:
  - name: project-a
    path: 'C:\workspace\project-a'

  - name: project-b
    path: 'D:\workspace\project-b'

extensions:
  - sql
  - java
  - js
  - jsp

include_keywords:
  - policy
  - customer

exclude_keywords:
  - test
  - backup
  - temp
  - old

exclude_folders:
  - .git
  - target
  - node_modules
  - dist

search:
  ignore_case: true
  include_hidden: false
  respect_gitignore: true

security:
  # 預設拒絕 UNC/network path；若確定信任遠端來源才改為 true。
  allow_network_paths: false

output:
  folder: 'D:\rg-output'
  preserve_structure: true
  # 原始檔案預設不覆寫；報告可每次更新。
  overwrite_files: false
  overwrite_report: true
  md_filename: 'search_result.md'
